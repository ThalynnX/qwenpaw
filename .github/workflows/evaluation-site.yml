name: Evaluation website checks
on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/evaluation-site.yml'
      - '.github/workflows/deploy-website.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm --dir website install --frozen-lockfile
      - name: Validate append-only results
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node website/scripts/build-evaluation-index.mjs "$BASE_SHA"
      - run: pnpm --dir website build
