name: Sync upstream QwenPaw

on:
  schedule:
    # 每5天 02:00 UTC (10:00 北京时间) 自动拉取上游更新
    - cron: '0 2 */5 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/agentscope-ai/QwenPaw.git
          git fetch upstream

      - name: Sync main branch
        run: |
          git config user.name "ThalynnX"
          git config user.email "thalynnx@users.noreply.github.com"
          
          git checkout main
          
          if git diff --quiet upstream/main origin/main; then
            echo "main 已是最新，无需同步"
          else
            git merge upstream/main --no-edit
            # 丢弃上游对 .github/workflows 的变更，保留本地 workflow 文件
            git restore --source=HEAD^ --staged --worktree .github/workflows 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "chore: keep local workflows after upstream sync"
            fi
            git push origin main
            echo "main 已同步并推送"
          fi

      - name: Sync stable branch
        run: |
          git config user.name "ThalynnX"
          git config user.email "thalynnx@users.noreply.github.com"
          
          # 检查上游是否有 stable 分支
          if git ls-remote --heads upstream stable | grep -q stable; then
            git fetch upstream stable:stable-local 2>/dev/null || true
            git checkout -B stable
            
            if git diff --quiet stable-local origin/stable; then
              echo "stable 已是最新，无需同步"
            else
              git merge stable-local --no-edit
              # 丢弃上游对 .github/workflows 的变更
              git restore --source=HEAD^ --staged --worktree .github/workflows 2>/dev/null || true
              if ! git diff --cached --quiet; then
                git commit -m "chore: keep local workflows after upstream stable sync"
              fi
              git push origin stable --force-with-lease
              echo "stable 已同步并推送"
            fi
          else
            echo "上游无 stable 分支，跳过"
          fi
